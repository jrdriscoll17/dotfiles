# =============================================================================
# Font
# =============================================================================
font_family      UbuntuMono Nerd Font
font_size        12.0

# =============================================================================
# Cursor
# =============================================================================
cursor_shape          beam
cursor_beam_thickness 1.5
cursor                #ffcb6b
cursor_text_color     #000000

# =============================================================================
# Window
# =============================================================================
window_padding_width 10
# Center content when the window size isn't an exact multiple of the cell size
# (the equivalent of alacritty's dynamic_padding)
placement_strategy   center

background_opacity   0.5
# Blur is applied by Hyprland (decoration:blur), not by kitty — kitty's own
# background_blur only works on macOS/KDE.

scrollback_lines     10000
confirm_os_window_close 0
enable_audio_bell    no

# =============================================================================
# Colors
# =============================================================================
# Generated by ~/.config/theme; `theme set <name>` rewrites it and SIGUSR1s
# kitty so open windows recolour without a restart.
include theme.conf
