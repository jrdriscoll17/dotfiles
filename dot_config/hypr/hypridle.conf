general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/monitors-on.sh
}

listener {
    timeout = 300                                 # 5min: lock screen
    on-timeout = loginctl lock-session
}

listener {
    timeout = 310                                 # 5min10s: monitors off
    # Native `dpms off` is unusable here: the aquamarine bug left screens lit,
    # and even in Hyprland 0.56 the dpms *wake* path is unreliable (can strand
    # a panel in standby). So blank/wake entirely over DDC (VCP D6) instead.
    # NB: 0.56 also broke the legacy `hyprctl dispatch dpms ...` CLI syntax
    # (now Lua: hl.dsp.dpms("off")), so the old calls were silent no-ops.
    on-timeout = ~/.config/hypr/scripts/monitors-off.sh
    on-resume = ~/.config/hypr/scripts/monitors-on.sh
}
