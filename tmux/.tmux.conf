# =============================================================================
# General settings
# =============================================================================

# True color + 256-color support (so nvim themes render correctly)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB,*:RGB"

# Let the kitty graphics protocol through tmux (needed for inline images in nvim)
set -g allow-passthrough on

# Faster key repeat — default 500ms breaks vim/nvim escape
set -sg escape-time 10

# Bigger scrollback buffer
set -g history-limit 50000

# Number windows/panes from 1 (so Alt-1 is the first window, not Alt-0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps in Alt-1, Alt-2, ...)
set -g renumber-windows on

# Mouse support (click panes, drag borders, scroll)
set -g mouse on

# Don't rename windows automatically (you set the names, tmux keeps them)
set -g allow-rename off

# Focus events (lets nvim notice when its pane gains/loses focus)
set -g focus-events on

# =============================================================================
# Keybindings — direct Alt+key (no prefix needed for common ops)
# =============================================================================

# Prefix stays as Ctrl-b for rare commands (copy mode, rename, etc.)

# Splits — match VS Code/nvim mental model (line direction = key)
#   Alt-v = vertical line between panes  (new pane on the right)
#   Alt-h = horizontal line between panes (new pane on the bottom)
# (tmux's underlying -h/-v flags are confusingly named; we just bind around them)
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-h split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt + arrow keys
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Resize panes with Alt + Shift + arrow keys (repeatable)
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Down  resize-pane -D 3
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Right resize-pane -R 5

# Window management
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-w choose-tree -Zw   # interactive window picker
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Session management
bind -n M-s choose-tree -Zs   # interactive session picker
bind -n M-d detach-client

# Misc
bind -n M-x kill-pane
bind -n M-r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# =============================================================================
# Copy mode — vim-style (since you use nvim)
# =============================================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"  # Wayland clipboard

# Don't auto-copy when mouse drag ends — keep the selection visible instead.
# Press `y` to copy, `q` or `Escape` to cancel.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# =============================================================================
# Plugins (managed by TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'odedlaz/tmux-onedark-theme'

# resurrect: also capture pane contents and restore running programs (nvim, etc.)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
