# Colours live in colors.toml, generated by ~/.config/theme.
# Alacritty watches its config, so a theme switch recolours open windows.
[general]
import = ["~/.config/alacritty/colors.toml"]

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.5
blur = true

[cursor]
style = "Beam"

[font]
size = 12

[font.normal]
family = "UbuntuMono Nerd Font"
style = "Regular"
